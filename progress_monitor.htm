<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MesonX Pulse | AniShiv</title>
<meta name="description" content="AniShiv Progress Monitor dashboard - track daily project tasks, accomplishments, accrued time overhead, and strategic end goals." />
<style>
  /* Apple-inspired design system */
  :root {
    --blue: #0071e3;
    --blue-active: #0077ed;
    --ink: #1d1d1f;
    --sub: #6e6e73;
    --hair: #d2d2d7;
    --row-line: #e8e8ed;
    --fill: #f5f5f7;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(0, 113, 227, 0.22); }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--fill);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }
  .back { display: inline-block; margin-bottom: 1.5rem; color: var(--blue); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
  .back:hover { text-decoration: underline; }
  h1 { font-size: 2.4rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 0.35rem; }
  .wrap h2 { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 0.25rem; }
  p { line-height: 1.5; }

  /* Panel / card components */
  .panel {
    padding: 1.5rem;
    background: var(--card);
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    margin-bottom: 1.25rem;
  }
  .panel h2 { margin-top: 0; font-size: 1.15rem; }
  label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; font-weight: 600; color: #424245; }
  input, select, textarea {
    width: 100%;
    padding: 0.72rem 0.9rem;
    margin-bottom: 1rem;
    border: 1px solid var(--hair);
    border-radius: 12px;
    background: var(--card);
    font: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.14);
  }
  button {
    padding: 0.62rem 1.15rem;
    border: none;
    border-radius: 980px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.92rem;
    font-family: inherit;
    color: #fff;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { opacity: 0.94; }
  button:active { transform: scale(0.97); }
  .btn-blue { background: var(--blue); }
  .btn-blue:hover { background: var(--blue-active); }
  .btn-green { background: #16a34a; }
  .btn-edit { background: #e8e8ed; color: #424245; padding: 0.32rem 0.8rem; font-size: 0.8rem; margin-left: 0.75rem; }
  .btn-edit:hover { background: #dcdce1; opacity: 1; }
  .btn-cancel { background: #e8e8ed; color: #424245; padding: 0.32rem 0.8rem; font-size: 0.8rem; }
  .btn-cancel:hover { background: #dcdce1; opacity: 1; }

  /* Dashboard card */
  .dash {
    background: var(--card);
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 22px;
    padding: 1.75rem;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.08);
  }
  /* Segmented control tabs (iOS-style) */
  .tabs {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    background: #e8e8ed;
    border-radius: 980px;
    margin: 1.5rem 0 1.5rem;
  }
  .tab {
    background: transparent;
    color: var(--sub);
    padding: 0.45rem 1.2rem;
    border-radius: 980px;
    font-size: 0.9rem;
  }
  .tab.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.14); }
  .tab .count { opacity: 0.6; font-weight: 400; margin-left: 0.35rem; }

  /* Project cards */
  .proj-h3 { margin: 0 0 0.6rem; font-size: 1.45rem; font-weight: 650; letter-spacing: -0.01em; color: var(--ink); }
  .goals {
    margin: 0 0 1rem;
    font-size: 0.95rem;
    color: #515154;
    background: #f2f2f7;
    padding: 0.85rem 1rem;
    border-radius: 14px;
  }
  .empty { color: var(--sub); font-style: italic; }
  .proj-website { margin: 0 0 1rem; font-size: 0.9rem; }
  .proj-website a { color: var(--blue); text-decoration: none; font-weight: 600; }
  .proj-website a:hover { text-decoration: underline; }
  .no-website { color: var(--sub); font-style: italic; }

  /* Table (Apple-style, hairline separators) */
  table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
  th {
    padding: 0.85rem 0.75rem;
    border-bottom: 1px solid var(--hair);
    color: var(--sub);
    font-weight: 600;
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  td { padding: 0.95rem 0.75rem; border-bottom: 1px solid var(--row-line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafafc; }
  td.hours { color: var(--blue); font-weight: 700; }
  td.date { font-weight: 600; color: #424245; white-space: nowrap; }

  /* Platform chips */
  .badge-plat {
    display: inline-block;
    background: #f2f2f7;
    color: #3a3a3c;
    border-radius: 980px;
    padding: 0.22rem 0.7rem;
    margin: 0 0.3rem 0.3rem 0;
    font-size: 0.8rem;
  }
  .no-plat { color: var(--sub); font-size: 0.85rem; }
  .platform-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
  @media (max-width: 560px) { .platform-grid { grid-template-columns: repeat(2, 1fr); } }
  .platform-grid label {
    display: flex; align-items: center; gap: 0.45rem; margin: 0;
    font-weight: 500; font-size: 0.88rem; color: #3a3a3c;
    background: #fbfbfd; border: 1px solid var(--hair);
    padding: 0.5rem 0.65rem; border-radius: 12px; cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .platform-grid label:hover { border-color: var(--blue); }
  .platform-grid input[type="checkbox"] { margin: 0; width: auto; accent-color: var(--blue); }

  /* Toast message */
  .msg {
    padding: 0.75rem 1rem;
    border-radius: 12px;
    margin: 1rem 0;
    display: none;
    font-size: 0.92rem;
    font-weight: 500;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
  }
  .msg.ok { background: #e7f6ec; color: #0f6b34; display: block; }
  .msg.err { background: #fdecec; color: #b00020; display: block; }
  /* Floating frosted-glass sidebar overlay (50% of the page) */
  .sidebar {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    width: min(50vw, 620px);
    min-width: 340px;
    background: rgba(245, 245, 247, 0.82);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border-left: 1px solid rgba(0, 0, 0, 0.08);
    border-top-left-radius: 26px;
    border-bottom-left-radius: 26px;
    box-shadow: -22px 0 60px rgba(0, 0, 0, 0.18);
    box-sizing: border-box;
    padding: 1.75rem 1.9rem 3rem;
    overflow-y: auto;
    z-index: 1000;
    transform: translateX(105%);
    transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-head { display: flex; align-items: center; justify-content: space-between; margin: -0.25rem 0 1.1rem; }
  .sidebar-head h2 { margin: 0; font-size: 1.3rem; letter-spacing: -0.01em; }
  .sidebar-close { background: rgba(0, 0, 0, 0.08); color: #424245; padding: 0.42rem 0.75rem; font-size: 0.9rem; }
  .sidebar-close:hover { background: rgba(0, 0, 0, 0.13); opacity: 1; }

  /* Vertical floating tab rail (top-right): Setup / Log Time */
  .rail {
    position: fixed;
    top: 1.1rem;
    right: 1.1rem;
    z-index: 1001;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }
  .rail-tab {
    background: rgba(255, 255, 255, 0.72);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    backdrop-filter: blur(18px) saturate(180%);
    color: var(--sub);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 980px;
    padding: 0.58rem 1.1rem;
    font-size: 0.85rem;
    font-weight: 600;
    line-height: 1;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    cursor: pointer;
    text-align: center;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  .rail-tab:hover { background: rgba(255, 255, 255, 0.95); color: var(--ink); opacity: 1; }
  .rail-tab:active { transform: scale(0.96); }
  .rail-tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .rail-tab.active:hover { background: var(--blue-active); color: #fff; }

  /* Sidebar panels (only the active one is shown) */
  .s-panel { display: none; }
  .s-panel.active { display: block; }

  /* Data visualization cards & animated charts */
  .chart-card {
    background: var(--card);
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 22px;
    padding: 1.25rem 1.5rem 1rem;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.08);
    margin: 1.25rem 0 1.25rem;
  }
  .chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 0.75rem; }
  .chart-title { font-weight: 650; font-size: 1.05rem; }
  .chart-sub { color: var(--sub); font-size: 0.8rem; }
  .chart-body { overflow-x: auto; }
  .byDate-svg { width: 100%; height: 150px; display: block; }
  .trend-wrap { margin: 1rem 0 1.25rem; }
  .trend-svg { width: 100%; height: 130px; display: block; }

  /* Line draw animation */
  .trend-line {
    fill: none; stroke: var(--blue); stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
    transition: stroke-dashoffset 1.5s ease;
  }
  .trend-line.dim { stroke: #c9c9d2; }
  .trend-area { fill: rgba(0, 113, 227, 0.13); transition: opacity 1.2s ease; opacity: 0; }
  .trend-area.show, .trend-area.animate { opacity: 1; }

  /* Bars grow in (projects by date) */
  .bar-col { transform-box: fill-box; transform-origin: center bottom; animation: growBar 0.7s ease forwards; }
  @keyframes growBar { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  .trend-dot { fill: var(--blue); transition: transform 0.2s ease; }
  .trend-dot:hover { transform: scale(1.6); transform-box: fill-box; transform-origin: center; }
  .chart-axis { fill: var(--sub); font-size: 9px; }
  .legend { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin-top: 0.5rem; font-size: 0.78rem; color: #515154; }
  .legend b { color: var(--ink); }

  @media (max-width: 720px) {
    .sidebar { width: 100%; min-width: 0; border-radius: 0; }
    h1 { font-size: 1.85rem; }
  }
</style>
</head>
<body>
<div class="wrap content" id="content">
  <a class="back" href="/">&larr; Back to AniShiv World</a>
  <h1>⚡ MesonX Pulse</h1>
  <div id="msg" class="msg"></div>

  <!-- Main content: Live Operational Dashboard -->
  <h2>📡 Streaming Status</h2>
  <!-- Projects by date: aggregate workload chart shown above the tabs -->
  <div class="chart-card" id="byDateCard">
    <div class="chart-head">
      <span class="chart-title">📅 Projects by Date</span>
      <span class="chart-sub" id="byDateRange"></span>
    </div>
    <div class="chart-body" id="byDateChart"></div>
  </div>
  <div class="tabs">
    <button type="button" class="tab active" data-tab="Enterprise">🏢 Enterprise<span class="count" id="count-Enterprise">0</span></button>
    <button type="button" class="tab" data-tab="Personal">🏠 Personal<span class="count" id="count-Personal">0</span></button>
  </div>
  <div class="dash" id="dashboard">
    <p class="empty">No tracking projects found. Use the floating form controls to add a project profile.</p>
  </div>
</div>

<!-- Vertical floating tab rail (top-right): opens each form panel in the sidebar -->
<div class="rail">
  <button type="button" id="tabSetup" class="rail-tab" data-panel="setup">⚙️ Setup</button>
  <button type="button" id="tabLog" class="rail-tab" data-panel="log">⏱️ Log Time</button>
</div>

<div class="sidebar" id="progressSidebar" aria-hidden="true">
  <div class="sidebar-head">
    <h2>🧰 Project Controls</h2>
    <button type="button" id="sidebarClose" class="sidebar-close" title="Close sidebar">✕</button>
  </div>

  <!-- Panel A: Engine Infrastructure Setup -->
  <div class="panel s-panel active" id="panelSetup">
    <h2>➕ Setup / ✏️ Edit Project Profile</h2>
    <form id="form-project">
      <input type="hidden" id="editingProjectId" value="" />
      <label>Project Name:</label>
      <input type="text" id="projName" placeholder="e.g., E-Commerce Infrastructure Engine" required />
      <label>End Goal Architecture:</label>
      <textarea id="endGoal" rows="4" placeholder="e.g., Deliver zero-latency shopping session workflows..."></textarea>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        <div>
          <label>Tab / Category:</label>
          <select id="projCategory">
            <option value="Enterprise" selected>🏢 Enterprise</option>
            <option value="Personal">🏠 Personal</option>
          </select>
        </div>
        <div>
          <label>Website Link:</label>
          <input type="url" id="projWebsite" placeholder="e.g., https://example.com" />
        </div>
      </div>
      <label>Project Platforms (select all that apply):</label>
      <div class="platform-grid">
        <label><input type="checkbox" class="plat-cb" value="Desktop"><span>🖥️ Desktop</span></label>
        <label><input type="checkbox" class="plat-cb" value="Mobile"><span>📱 Mobile</span></label>
        <label><input type="checkbox" class="plat-cb" value="Web"><span>🌐 Web</span></label>
        <label><input type="checkbox" class="plat-cb" value="eCommerce"><span>🛒 eCommerce</span></label>
        <label><input type="checkbox" class="plat-cb" value="AI"><span>🤖 AI</span></label>
        <label><input type="checkbox" class="plat-cb" value="Sports"><span>⚽ Sports</span></label>
      </div>
      <div>
        <button type="submit" class="btn-blue" id="projSubmitBtn">Initialize Project</button>
        <button type="button" class="btn-cancel" id="projCancelBtn" style="display:none;">Cancel Edit</button>
      </div>
    </form>
  </div>

  <!-- Panel B: Production Status Management Log Entries -->
  <div class="panel s-panel" id="panelLog">
    <h2>📝 Log Daily Execution Progress</h2>
    <form id="form-log">
      <label>Target Project Reference:</label>
      <select id="selectedProj"></select>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        <div>
          <label>Log Date:</label>
          <input type="date" id="logDate" required />
        </div>
        <div>
          <label>Time Expended (Hours):</label>
          <input type="number" id="timeSpent" step="0.25" min="0" placeholder="e.g., 3.5" required />
        </div>
      </div>
      <label>Daily Tasks Attempted:</label>
      <textarea id="tasks" rows="3" placeholder="List current operational metrics worked on..."></textarea>
      <label>Concrete Accomplishments:</label>
      <textarea id="accomplishments" rows="3" placeholder="What target milestones did you finalize today?"></textarea>
      <button type="submit" class="btn-green">Commit Active Track Log</button>
    </form>
  </div>
</div>

<script>
(function () {
  var API_BASE = 'progress_api.php';
  var db = { projects: [], logs: [] };

  var elMsg = document.getElementById('msg');
  var dashboard = document.getElementById('dashboard');
  var projSelect = document.getElementById('selectedProj');
  var formProject = document.getElementById('form-project');
  var formLog = document.getElementById('form-log');

  // Editable project form bindings
  var editingProjectId = document.getElementById('editingProjectId');
  var projSubmitBtn = document.getElementById('projSubmitBtn');
  var projCancelBtn = document.getElementById('projCancelBtn');
  var projCategory = document.getElementById('projCategory');
  var projWebsite = document.getElementById('projWebsite');

  // Floating sidebar bindings
  var contentEl = document.getElementById('content');
  var sidebar = document.getElementById('progressSidebar');
  var sidebarClose = document.getElementById('sidebarClose');
  var panelMap = {
    'setup': { tab: document.getElementById('tabSetup'), panel: document.getElementById('panelSetup') },
    'log':   { tab: document.getElementById('tabLog'),   panel: document.getElementById('panelLog') }
  };
  var activePanel = 'setup';

  function showPanel(name) {
    activePanel = name;
    Object.keys(panelMap).forEach(function (key) {
      var entry = panelMap[key];
      entry.tab.classList.toggle('active', key === name);
      entry.panel.classList.toggle('active', key === name);
    });
    openSidebar();
  }

  function openSidebar() {
    sidebar.classList.add('open');
    contentEl.classList.add('sidebar-open');
    sidebar.setAttribute('aria-hidden', 'false');
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    contentEl.classList.remove('sidebar-open');
    sidebar.setAttribute('aria-hidden', 'true');
    Object.keys(panelMap).forEach(function (key) {
      panelMap[key].tab.classList.remove('active');
    });
  }

  // Active dashboard tab (legacy projects w/o a category default to Enterprise)
  var activeTab = 'Enterprise';
  var CATEGORIES = ['Enterprise', 'Personal'];

  // Visualization window for the trending graphs
  var TREND_START = '2026-01-01';
  var TREND_END = new Date().toISOString().split('T')[0];

  function projectCategory(project) {
    return (project.category === 'Personal') ? 'Personal' : 'Enterprise';
  }

  // Platform breakdown options with their display icons
  var PLATFORM_META = {
    'Desktop':   { icon: '🖥️', name: 'Desktop' },
    'Mobile':    { icon: '📱', name: 'Mobile' },
    'Web':       { icon: '🌐', name: 'Web' },
    'eCommerce': { icon: '🛒', name: 'eCommerce' },
    'AI':        { icon: '🤖', name: 'AI' },
    'Sports':    { icon: '⚽', name: 'Sports' }
  };

  function getSelectedPlatforms() {
    var out = [];
    document.querySelectorAll('.plat-cb').forEach(function (cb) {
      if (cb.checked) out.push(cb.value);
    });
    return out;
  }

  function setPlatformCheckboxes(values) {
    var selected = Array.isArray(values) ? values : [];
    document.querySelectorAll('.plat-cb').forEach(function (cb) {
      cb.checked = selected.indexOf(cb.value) !== -1;
    });
  }

  function resetProjectForm() {
    editingProjectId.value = '';
    document.getElementById('projName').value = '';
    document.getElementById('endGoal').value = '';
    projCategory.value = 'Enterprise';
    projWebsite.value = '';
    document.querySelectorAll('.plat-cb').forEach(function (cb) { cb.checked = false; });
    projSubmitBtn.textContent = 'Initialize Project';
    projCancelBtn.style.display = 'none';
  }

  function showMsg(text, type, ms) {
    elMsg.textContent = text;
    elMsg.className = 'msg ' + (type || 'ok');
    if (ms) setTimeout(function () { elMsg.className = 'msg'; }, ms);
  }

  function refreshData(cb) {
    return fetch(API_BASE + '?route=data')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        db = data && data.projects ? data : { projects: [], logs: [] };
        render();
        if (cb) cb();
      })
      .catch(function (err) {
        console.error('Critical failure during active background connection stream handshake:', err);
        showMsg('Could not reach the tracker API (' + API_BASE + ').', 'err', 4000);
      });
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Renders the selected platform chips (with icons) for a project card.
  function buildPlatformBadges(platforms) {
    var list = Array.isArray(platforms) ? platforms : [];
    if (list.length === 0) return '<span class="no-plat">None selected</span>';
    return list.map(function (key) {
      var meta = PLATFORM_META[key] || { icon: '📦', name: key };
      return '<span class="badge-plat">' + meta.icon + ' ' + escapeHtml(meta.name) + '</span>';
    }).join('');
  }

  // ------------------------------------------------------------------
  // Data visualization helpers (animated SVG charts)
  // ------------------------------------------------------------------
  function allDatesBetween(start, end) {
    var out = [];
    var cur = new Date(start + 'T00:00:00');
    var last = new Date(end + 'T00:00:00');
    while (cur <= last) {
      out.push(cur.toISOString().split('T')[0]);
      cur.setDate(cur.getDate() + 1);
    }
    return out;
  }
  function shortDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  // Build a daily-series array of {date, y} from a map of date -> hours
  function dailySeries(buckets, start, end) {
    return allDatesBetween(start, end).map(function (d) {
      return { date: d, y: (buckets[d] || 0) };
    });
  }
  // Build an SVG polyline path from points within [min,max] scaled to a box
  function linePath(points, w, h, minY, maxY, pad) {
    var range = (maxY - minY) || 1;
    var innerW = w - pad * 2;
    var innerH = h - pad * 2;
    return points.map(function (p, i) {
      var x = pad + (points.length <= 1 ? innerW / 2 : (i / (points.length - 1)) * innerW);
      var y = pad + innerH - ((p.y - minY) / range) * innerH;
      return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join(' ');
  }
  function polyAreaPath(line) {
    var pts = line.trim().replace(/^M/, '').split(/[L]/).map(function (s) {
      return s.trim();
    }).filter(Boolean);
    var last = pts[pts.length - 1];
    var first = pts[0];
    return line + ' L' + last + ' L' + first.split(' ')[0] + ' 0 L' + first.split(' ')[0] + ' ' + first.split(' ')[1] + ' Z';
  }

  // CSS-driven animation: draw the line, fade in the area, stagger bars/dots
  function animateChart(svg) {
    var line = svg.querySelector('path.trend-line');
    if (line) {
      var len = line.getTotalLength();
      line.style.strokeDasharray = len;
      line.style.strokeDashoffset = len;
      requestAnimationFrame(function () { line.style.strokeDashoffset = '0'; });
    }
    var area = svg.querySelector('path.trend-area');
    if (area) requestAnimationFrame(function () { area.classList.add('animate'); });
  }

  // Renders an animated area/line trend chart into an element.
  function renderTrend(parentEl, series, opts) {
    opts = opts || {};
    var w = (opts.width || 600) - (opts.padX || 0);
    var h = opts.height || 130;
    var padX = opts.padX || 8;
    var padTop = opts.padTop || 14;
    var padBottom = opts.padBottom || 20;
    var innerW = w - padX * 2;
    var innerH = h - padTop - padBottom;
    var maxY = opts.maxY != null ? opts.maxY : Math.max(1, Math.max.apply(null, series.map(function (p) { return p.y; })));
    var n = series.length;
    var yTicks = opts.yTicks == null ? 3 : opts.yTicks;

    var px = function (i) { return n <= 1 ? padX + innerW / 2 : padX + (i / (n - 1)) * innerW; };
    var py = function (y) { return padTop + innerH - (y / maxY) * innerH; };

    var line = linePath(series, w, h, 0, maxY, Math.min(padTop, padX));
    var area = polyAreaPath(line);

    var svg = '<svg class="trend-svg" viewBox="0 0 ' + w + ' ' + h + '">';
    svg += '<path class="trend-area" d="' + area + '"></path>';
    svg += '<path class="trend-line" d="' + line + '"></path>';
    // grid + y axis ticks
    for (var t = 0; t <= yTicks; t++) {
      var yv = (maxY * t) / yTicks;
      var yy = py(yv);
      svg += '<line x1="' + padX + '" y1="' + yy + '" x2="' + (w - padX) + '" y2="' + yy + '" stroke="#ececf1" stroke-width="1"></line>';
      svg += '<text class="chart-axis" x="' + (padX - 4) + '" y="' + (yy + 3) + '" text-anchor="end">' + (t === 0 ? '' : yv.toFixed(yv % 1 ? 1 : 0)) + '</text>';
    }
    // x-axis labels (first, middle, last)
    [
      { i: 0, anchor: 'start' },
      { i: Math.floor(n / 2), anchor: 'middle' },
      { i: n - 1, anchor: 'end' }
    ].forEach(function (el) {
      var x = px(el.i);
      svg += '<text class="chart-axis" x="' + x + '" y="' + (h - 4) + '" text-anchor="' + el.anchor + '">' + shortDate(series[el.i].date) + '</text>';
    });
    // dots (animate via CSS)
    series.forEach(function (p, i) {
      var x = px(i); var y = py(p.y);
      svg += '<circle class="trend-dot" cx="' + x + '" cy="' + y + '" r="2.4" style="animation:growBar .4s ease ' + (i * 0.02) + 's both"></circle>';
    });
    svg += '</svg>';

    parentEl.innerHTML = svg;
    animateChart(parentEl.querySelector('svg'));
    return maxY;
  }

  // Aggregate every project's daily hours across the window (sum per date)
  function computeByDate() {
    var buckets = {};
    var projectBuckets = {};
    db.logs.forEach(function (log) {
      var h = parseFloat(log.timeSpent || 0);
      if (!h || log.date < TREND_START) return;
      buckets[log.date] = (buckets[log.date] || 0) + h;
      projectBuckets[log.projectId] = projectBuckets[log.projectId] || {};
      projectBuckets[log.projectId][log.date] = (projectBuckets[log.projectId][log.date] || 0) + h;
    });
    // total per project over window
    var projectTotals = {};
    Object.keys(projectBuckets).forEach(function (pid) {
      var sum = Object.keys(projectBuckets[pid]).reduce(function (a, d) { return a + projectBuckets[pid][d]; }, 0);
      projectTotals[pid] = sum;
    });
    return { byDate: buckets, perProject: projectBuckets, projectTotals: projectTotals };
  }

  // Renders the "Projects by Date" aggregate chart above the tabs.
  function renderByDateChart() {
    var el = document.getElementById('byDateChart');
    var rangeEl = document.getElementById('byDateRange');
    if (!el) return;
    var agg = computeByDate();
    var series = dailySeries(agg.byDate, TREND_START, TREND_END);
    var total = series.reduce(function (a, p) { return a + p.y; }, 0);
    rangeEl.textContent = shortDate(TREND_START) + ' – ' + shortDate(TREND_END) +
      ' · Total ' + total.toFixed(1) + ' hrs across ' + Object.keys(agg.projectTotals).length + ' projects';
    renderTrend(el, series, { width: 720, height: 150 });
    var top = Object.keys(agg.projectTotals)
      .map(function (pid) {
        var p = db.projects.filter(function (x) { return x.id === pid; })[0];
        return { name: p ? p.name : pid, hours: agg.projectTotals[pid] };
      })
      .sort(function (a, b) { return b.hours - a.hours; })
      .slice(0, 6);
    var legend = '<div class="legend">' + top.map(function (pr) {
      return '<span><b>' + escapeHtml(pr.name) + '</b> · ' + pr.hours.toFixed(1) + ' hrs</span>';
    }).join('') + '</div>';
    el.insertAdjacentHTML('beforeend', legend);
  }

  // Renders an animated cumulative trending graph for one project.
  function renderProjectTrend(el, projectId) {
    if (!el) return;
    var agg = computeByDate();
    var buckets = agg.perProject[projectId] || {};
    var daily = dailySeries(buckets, TREND_START, TREND_END);
    var cum = 0;
    var cumulative = daily.map(function (d) { cum += d.y; return { date: d.date, y: cum }; });
    var total = cum;
    renderTrend(el, cumulative, { width: 600, height: 130 });
    var cap = document.createElement('div');
    cap.className = 'legend';
    cap.innerHTML = '<b>📈 Trending (cumulative)</b> — <b>' + total.toFixed(1) + ' hrs</b> total since ' + shortDate(TREND_START);
    el.parentNode.appendChild(cap);
  }

  function render() {
    // Logging dropdown always lists every project (independent of the active tab).
    projSelect.innerHTML = '';
    db.projects.forEach(function (p) {
      var opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      projSelect.appendChild(opt);
    });

    // Update tab counts and active tab styling.
    CATEGORIES.forEach(function (cat) {
      var countEl = document.getElementById('count-' + cat);
      if (countEl) countEl.textContent = db.projects.filter(function (p) { return projectCategory(p) === cat; }).length;
      var tabBtn = document.querySelector('.tab[data-tab="' + cat + '"]');
      if (tabBtn) tabBtn.classList.toggle('active', activeTab === cat);
    });

    // Filter the dashboard cards by the currently selected tab.
    var visible = db.projects.filter(function (p) { return projectCategory(p) === activeTab; });

    // Refresh the "Projects by Date" aggregate chart (all projects, regardless of tab).
    renderByDateChart();

    if (visible.length === 0) {
      dashboard.innerHTML = '<p class="empty">No ' + escapeHtml(activeTab) + ' projects found. Initialize a project above (or switch tabs) to start parsing records.</p>';
      return;
    }

    var html = '';
    visible.forEach(function (project) {
      var projectLogs = db.logs.filter(function (l) { return l.projectId === project.id; });
      var totalHours = projectLogs.reduce(function (sum, cur) { return sum + parseFloat(cur.timeSpent || 0); }, 0);

      html += '<div style="margin:0 0 2.5rem;padding-bottom:1.5rem;border-bottom:1px solid #eee;">';
      html += '<h3 class="proj-h3">📁 ' + escapeHtml(project.name) +
              '<button type="button" class="btn-edit" data-edit="' + escapeHtml(project.id) + '">✏️ Edit</button></h3>';
      html += '<p class="goals" style="margin-bottom:0.5rem;"><strong>🎯 Core End Goal Target:</strong> ' +
              escapeHtml(project.endGoal || 'None Specified') +
              '<span style="margin:0 10px;color:#ccc">|</span>' +
              '<strong>⏳ Accrued Overhead:</strong> ' + totalHours.toFixed(2) + ' Hours Total</p>';
      html += '<p class="proj-website"><strong>🔗 Website:</strong> ' + buildWebsiteLink(project.website) + '</p>';
      html += '<div style="margin:0 0 1rem;"><strong style="font-size:0.85rem;">🖱️ Platforms:</strong> ' +
              buildPlatformBadges(project.platforms) + '</div>';
      html += '<div class="trend-wrap" id="trend-' + escapeHtml(project.id) + '"></div>';

      if (projectLogs.length === 0) {
        html += '<p class="empty" style="margin-left:0.5rem;">No logs registered to this project profile yet.</p>';
      } else {
        html += '<div style="overflow-x:auto;"><table>';
        html += '<thead><tr><th style="width:150px">Target Date</th><th style="width:120px">Tracked Effort</th><th>Engine Tasks</th><th>Milestones &amp; Accomplishments</th></tr></thead>';
        html += '<tbody>';
        projectLogs.forEach(function (log) {
          html += '<tr>';
          html += '<td class="date">' + escapeHtml(log.date) + '</td>';
          html += '<td class="hours">' + escapeHtml(log.timeSpent) + ' hrs</td>';
          html += '<td style="white-space:pre-wrap">' + escapeHtml(log.tasks) + '</td>';
          html += '<td style="white-space:pre-wrap">' + escapeHtml(log.accomplishments) + '</td>';
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      }
      html += '</div>';
    });
    dashboard.innerHTML = html;
    // Render + animate each visible project's trending graph.
    visible.forEach(function (project) {
      renderProjectTrend(document.getElementById('trend-' + project.id), project.id);
    });
  }

  // Renders the project website link, or an "add a link" hint when empty.
  function buildWebsiteLink(website) {
    var url = String(website || '').trim();
    if (!url) return '<span class="no-website">No link set — add one via ✏️ Edit.</span>';
    var safe = escapeHtml(url);
    var display = safe.replace(/^https?:\/\//i, '');
    return '<a href="' + safe + '" target="_blank" rel="noopener noreferrer">' + display + '</a>';
  }

  // Create or update a project profile
  formProject.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('projName').value.trim();
    var goal = document.getElementById('endGoal').value.trim();
    var platforms = getSelectedPlatforms();
    if (!name) return;

    var editId = editingProjectId.value;
    var route = editId ? 'project_update' : 'project';
    var payload = {
      name: name,
      endGoal: goal,
      category: projCategory.value,
      website: projWebsite.value.trim(),
      platforms: platforms
    };
    if (editId) payload.id = editId;

    fetch(API_BASE + '?route=' + route, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function () {
        resetProjectForm();
        refreshData(function () {
          showMsg(editId ? 'Project profile updated successfully.' : 'Project profile initialized successfully.', 'ok', 3000);
        });
      })
      .catch(function () { showMsg(editId ? 'Failed to update project.' : 'Failed to create project.', 'err', 4000); });
  });

  projCancelBtn.addEventListener('click', function () {
    resetProjectForm();
  });

  // Top-right vertical tabs: open their panel, or close when re-clicked
  Object.keys(panelMap).forEach(function (key) {
    panelMap[key].tab.addEventListener('click', function () {
      if (activePanel === key && sidebar.classList.contains('open')) {
        closeSidebar();
      } else {
        showPanel(key);
      }
    });
  });
  sidebarClose.addEventListener('click', closeSidebar);

  // Edit button delegation (dashboard innerHTML is re-rendered, so listen on the container).
  dashboard.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.btn-edit') : null;
    if (!btn || !btn.dataset.edit) return;
    var project = db.projects.filter(function (p) { return p.id === btn.dataset.edit; })[0];
    if (!project) return;
    editingProjectId.value = project.id;
    document.getElementById('projName').value = project.name;
    document.getElementById('endGoal').value = project.endGoal || '';
    projCategory.value = projectCategory(project);
    projWebsite.value = project.website || '';
    setPlatformCheckboxes(project.platforms);
    projSubmitBtn.textContent = 'Save Project Changes';
    projCancelBtn.style.display = 'inline-block';
    showPanel('setup');
  });

  // Tab switching (Enterprise / Personal)
  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      activeTab = tab.dataset.tab;
      render();
    });
  });

  // Log daily progress
  formLog.addEventListener('submit', function (e) {
    e.preventDefault();
    var projectId = projSelect.value;
    var date = document.getElementById('logDate').value;
    var time = document.getElementById('timeSpent').value;
    if (!projectId || !time) return;
    fetch(API_BASE + '?route=log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        projectId: projectId,
        date: date,
        timeSpent: parseFloat(time),
        tasks: document.getElementById('tasks').value,
        accomplishments: document.getElementById('accomplishments').value
      })
    })
      .then(function (r) { return r.json(); })
      .then(function () {
        document.getElementById('timeSpent').value = '';
        document.getElementById('tasks').value = '';
        document.getElementById('accomplishments').value = '';
        document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
        refreshData(function () { showMsg('Active track log committed successfully.', 'ok', 3000); });
      })
      .catch(function () { showMsg('Failed to commit track log.', 'err', 4000); });
  });

  // Initialize date to today
  document.getElementById('logDate').value = new Date().toISOString().split('T')[0];

  // Foundations: show the Setup panel on wide screens, keep the tabs only on small screens.
  if (window.innerWidth >= 1100) { showPanel('setup'); } else { closeSidebar(); }

  // Hydrate application configuration contexts from the remote PHP runtime memory engine
  refreshData();
})();
</script>
